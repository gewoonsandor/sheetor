<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/emerald/icon/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/assets/emerald/icon/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/emerald/icon/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <title>Sheetor - Guitar TAB &amp; Sheet Music Editor</title>
    <script>
      /* Pre-paint theme, so a light-mode user never sees a dark flash while the
         bundle loads. Mirrors applyTheme() in src/features/user/theme.ts; keep the
         'sheetor-user' key and the theme/accent field names in sync with
         src/features/user/userStore.ts. */
      try {
        var u = JSON.parse(localStorage.getItem('sheetor-user') || '{}');
        var d = document.documentElement;
        d.dataset.theme =
          u.theme === 'light' || u.theme === 'dark'
            ? u.theme
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        if (typeof u.accent === 'string') d.dataset.accent = u.accent;
      } catch (e) {
        /* first visit, or storage blocked: the :root defaults stand */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
